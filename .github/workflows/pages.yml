name: GitHub Pages

on:
  push:
    branches: main
    # 사이트에 안 나오는 파일만 바뀐 push는 배포하지 않음
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.claude/**'
      - 'skills-lock.json'
      - '.vscode/**'
      - '.devcontainer/**'
      - '.husky/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # setup-node의 cache: yarn은 Corepack보다 먼저 실행돼 yarn 1을 잡기 때문에 쓰지 않고,
          # 아래에서 Corepack(yarn 3)을 켠 뒤 actions/cache로 직접 캐시함

      - name: Enable Corepack
        id: yarn
        run: |
          corepack enable
          corepack prepare yarn@3.6.1 --activate
          echo "cache-dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache yarn packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn.outputs.cache-dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', 'package.json') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Setup Pages
        id: configurepages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Cache Next.js / Contentlayer build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            .contentlayer/.cache
          key: next-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ hashFiles('app/**', 'components/**', 'layouts/**', 'css/**', 'data/**', 'contentlayer.config.ts', 'next.config.js') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-

      - name: Build with Next.js
        run: yarn build
        env:
          EXPORT: 1
          UNOPTIMIZED: 1
          BASE_PATH: ${{ steps.configurepages.outputs.base_path }}
          NEXT_PUBLIC_GISCUS_REPO: ${{ secrets.NEXT_PUBLIC_GISCUS_REPO }}
          NEXT_PUBLIC_GISCUS_REPOSITORY_ID: ${{ secrets.NEXT_PUBLIC_GISCUS_REPOSITORY_ID }}
          NEXT_PUBLIC_GISCUS_CATEGORY: ${{ secrets.NEXT_PUBLIC_GISCUS_CATEGORY }}
          NEXT_PUBLIC_GISCUS_CATEGORY_ID: ${{ secrets.NEXT_PUBLIC_GISCUS_CATEGORY_ID }}

      # 프로젝트 PDF: 아래 파일이 바뀌었을 때만 다시 만들고, 아니면 캐시된 PDF를 재사용
      - name: Restore project PDFs
        id: pdf-cache
        uses: actions/cache@v4
        with:
          path: .pdf-cache
          key: project-pdf-${{ hashFiles('data/projects/**', 'layouts/ProjectLayout.tsx', 'components/MDXComponents.tsx', 'app/layout.tsx', 'css/**', 'public/fonts/**', 'scripts/project-pdfs.mjs') }}

      # PDF가 실패해도 사이트 배포는 계속한다. 실패하면 .pdf-cache 를 지워서
      # 잘못된 결과가 캐시되지 않게 하고, 다음 배포에서 다시 시도한다.
      - name: Generate project PDFs
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          BASE_PATH: ${{ steps.configurepages.outputs.base_path }}
        run: |
          node scripts/project-pdfs.mjs --install --with-deps \
            && node scripts/project-pdfs.mjs --out .pdf-cache \
            || { rm -rf .pdf-cache; exit 1; }

      - name: Add project PDFs to site
        run: |
          mkdir -p out/static/pdf/projects
          if [ -d .pdf-cache ]; then cp -R .pdf-cache/. out/static/pdf/projects/; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
